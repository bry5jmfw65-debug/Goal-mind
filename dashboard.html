<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoalMind AI — Smart Analyzer</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>body{margin:0;background:#07111f;color:#f5f7fb;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #243349;padding-bottom:18px}.logo{font-weight:800;font-size:20px}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:#39d98a;color:#06130d}.panel{margin-top:22px;background:#0d1929;border:1px solid #243349;border-radius:18px;padding:22px}.upload{border:1px dashed #46607f;border-radius:14px;padding:28px;text-align:center}.upload input{display:none}.status{margin-top:15px;color:#aeb9c9}.count{margin-top:18px;padding:12px;border-radius:10px;background:#0a1626}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:18px}.match{background:#0b1625;border:1px solid #263953;border-radius:15px;padding:18px}.teams{display:flex;justify-content:space-between;align-items:center;font-weight:800}.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.odd{background:#101f33;padding:10px;border-radius:9px;text-align:center}.prob{margin-top:10px;color:#c4cedb}.bar{height:8px;background:#17263a;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#39d98a}.lean{margin-top:14px;font-weight:800}.small{font-size:12px;color:#7f8da1}.warn{color:#ffd37a}.hidden{display:none}canvas{max-width:100%}</style></head><body><div class="wrap"><div class="top"><div class="logo">⚽ GoalMind AI</div><button class="btn" onclick="location.href='index.html'">Home</button></div><div class="panel"><h1>Smart Screenshot Analyzer</h1><p class="status">Upload a SportyBet/virtual-football screenshot. GoalMind scans the whole image, separates fixture rows, OCRs each row, validates 1X2 odds, and creates one card per detected game.</p><div class="upload"><label class="btn" for="file">Choose screenshot</label><input id="file" type="file" accept="image/*"><div id="status" class="status">No image selected.</div></div><div id="count" class="count hidden"></div><div id="results" class="cards"></div></div></div><script>
const file=document.getElementById('file'),statusEl=document.getElementById('status'),countEl=document.getElementById('count'),results=document.getElementById('results');
file.addEventListener('change',e=>{const f=e.target.files[0];if(f) analyze(f)});
function norm(s){return s.replace(/[|]/g,'I').replace(/\s+/g,' ').trim()}
function oddsFromText(s){const a=[...s.matchAll(/(?:^|\s)([1-9]\d?\.\d{1,3})(?=\s|$)/g)].map(m=>+m[1]).filter(x=>x>=1.01&&x<=50);return a.length>=3?a.slice(0,3):[]}
function teamPair(s){const t=norm(s).toUpperCase().replace(/[^A-Z0-9\s\-]/g,' ');const before=t.split(/\b(?:1\.\d{1,2}|[2-9]\d?\.\d{1,3})\b/)[0].trim();const toks=before.split(/\s+/).filter(x=>x.length>=2);if(toks.length<2)return null;const stop=new Set(['SPORTYBET','FOOTBALL','VIRTUAL','LIVE','HOME','AWAY','DRAW','TODAY','MATCH','PREMIER']);const useful=toks.filter(x=>!stop.has(x));if(useful.length>=2)return [useful[0],useful[1]];return null}
function predict(o){const inv=o.map(x=>1/x),sum=inv.reduce((a,b)=>a+b,0),p=inv.map(x=>x/sum);let idx=p.indexOf(Math.max(...p));let lean=['Home','Draw','Away'][idx];let conf=Math.round(p[idx]*100);let margin=Math.round((p[idx]-p.slice().sort((a,b)=>b-a)[1])*100);let risk=conf>=65?'Lower':conf>=52?'Moderate':'High';return {p,lean,conf,margin,risk}}
function drawCard(m,i){const x=predict(m.odds),names=m.teams||['Team A','Team B'];return `<div class="match"><div class="small">MATCH ${i+1}</div><div class="teams"><span>${names[0]}</span><span>vs</span><span>${names[1]}</span></div><div class="odds">${m.odds.map((o,j)=>`<div class="odd"><b>${['1','X','2'][j]}</b><br>${o.toFixed(2)}</div>`).join('')}</div>${x.p.map((p,j)=>`<div class="prob">${['Home','Draw','Away'][j]} <b>${Math.round(p*100)}%</b></div><div class="bar"><i style="width:${Math.round(p*100)}%"></i></div>`).join('')}<div class="lean">Model lean: ${x.lean} <span class="small">· ${x.conf}% confidence · ${x.risk} risk</span></div><div class="small">Signal margin: ${x.margin} percentage points · Probabilities are estimates.</div></div>`}
async function analyze(file){results.innerHTML='';countEl.classList.add('hidden');statusEl.textContent='Preparing screenshot…';const img=new Image();img.onload=async()=>{const scale=Math.min(2,1600/img.width);const c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);ctx.drawImage(img,0,0,c.width,c.height);statusEl.textContent='Scanning fixture rows and reading text…';const {data}=await Tesseract.recognize(c,'eng',{logger:m=>{if(m.status==='recognizing text')statusEl.textContent=`Reading screenshot… ${Math.round(m.progress*100)}%`}});const text=data.text||'';const lines=text.split(/\n+/).map(norm).filter(Boolean);const found=[];for(let i=0;i<lines.length;i++){const o=oddsFromText(lines[i]);if(o.length===3){let pair=teamPair(lines[i]);if(!pair&&i>0)pair=teamPair(lines[i-1]+' '+lines[i]);found.push({teams:pair,odds:o,raw:lines[i]})}}const ded=[];for(const m of found){const key=m.odds.join('|')+'|'+(m.teams||[]).join('|');if(!ded.some(x=>x.key===key))ded.push({key,m})}let matches=ded.map(x=>x.m);if(matches.length){statusEl.textContent='Analysis complete.';countEl.classList.remove('hidden');countEl.textContent=`${matches.length} game${matches.length===1?'':'s'} detected • ${matches.filter(m=>m.teams).length} with team names read • ${matches.filter(m=>m.odds.length===3).length} with valid 1X2 odds`;results.innerHTML=matches.map(drawCard).join('')}else{statusEl.innerHTML='<span class="warn">No complete 1X2 rows were confidently detected.</span> Try a clearer/full screenshot. GoalMind will not invent missing games or odds.';countEl.classList.remove('hidden');countEl.textContent='0 validated games';} };img.src=URL.createObjectURL(file)}
</script></body></html>
